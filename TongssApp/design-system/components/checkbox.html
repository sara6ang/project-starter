<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkbox · 디자인 시스템</title>
<link rel="stylesheet" href="/TongssApp/assets/css/tokens.css">
<link rel="stylesheet" href="/TongssApp/design-system/assets/css/components.css">
<link rel="stylesheet" href="/TongssApp/design-system/assets/css/showcase.css">
</head>
<body class="ds-layout">
<aside data-include="/TongssApp/design-system/partials/nav.html"></aside>
<main class="ds-content">
<div class="cs-page">

  <a class="cs-back" href="/TongssApp/design-system/index.html"><i data-lucide="arrow-left"></i>디자인 시스템으로</a>

  <div class="cs-header">
    <div class="cs-header__eyebrow">Components</div>
    <h1 class="cs-header__title">Checkbox</h1>
    <p class="cs-header__desc">여러 항목 중 여러 개를 동시에 선택할 수 있을 때 사용합니다. (약관 동의, 목록 다중 선택 등)</p>
  </div>

  <!-- ============ State ============ -->
  <section class="cs-section">
    <h2 class="cs-section__title">State</h2>

    <div class="cs-block">
      <div class="cs-block__label">Unchecked</div>
      <div class="cs-row">
        <label class="checkbox">
          <input class="checkbox__input" type="checkbox">
          <span class="checkbox__box"><i data-lucide="check"></i></span>
          이메일 알림 받기
        </label>
      </div>
      <code class="cs-code">.checkbox > .checkbox__input + .checkbox__box</code>
    </div>

    <div class="cs-block">
      <div class="cs-block__label">Checked</div>
      <div class="cs-row">
        <label class="checkbox">
          <input class="checkbox__input" type="checkbox" checked>
          <span class="checkbox__box"><i data-lucide="check"></i></span>
          이용약관에 동의합니다
        </label>
      </div>
      <code class="cs-code">.checkbox__input:checked + .checkbox__box</code>
    </div>

    <div class="cs-block">
      <div class="cs-block__label">Disabled</div>
      <div class="cs-row cs-row--column">
        <label class="checkbox is-disabled">
          <input class="checkbox__input" type="checkbox" disabled>
          <span class="checkbox__box"><i data-lucide="check"></i></span>
          선택할 수 없음
        </label>
        <label class="checkbox is-disabled">
          <input class="checkbox__input" type="checkbox" checked disabled>
          <span class="checkbox__box"><i data-lucide="check"></i></span>
          이미 선택되어 변경 불가
        </label>
      </div>
      <code class="cs-code">.checkbox.is-disabled</code>
    </div>
  </section>

  <div class="cs-footer">CSS 원본: assets/css/components.css · 토큰: assets/css/tokens.css</div>
</div>

</main>

<script src="/TongssApp/assets/js/vendor/lucide.js"></script>
<script src="/TongssApp/design-system/assets/js/include.js"></script>
<script src="/TongssApp/assets/js/shared/icons.js"></script>
<script src="/TongssApp/design-system/assets/js/nav.js"></script>
<script>
  document.addEventListener('components:ready', () => {
    lucide.createIcons(); // 본문 아이콘 (nav.js가 사이드바 아이콘은 이미 처리함)
  });
</script>
</body>
</html>
