<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagination · 디자인 시스템</title>
<link rel="stylesheet" href="/TongssApp/assets/css/tokens.css">
<link rel="stylesheet" href="/TongssApp/design-system/assets/css/components.css">
<link rel="stylesheet" href="/TongssApp/design-system/assets/css/showcase.css">
</head>
<body class="ds-layout">
<aside data-include="/TongssApp/design-system/partials/nav.html"></aside>
<main class="ds-content">
<div class="cs-page">

  <a class="cs-back" href="/TongssApp/design-system/index.html"><i data-lucide="arrow-left"></i>디자인 시스템으로</a>

  <div class="cs-header">
    <div class="cs-header__eyebrow">Components</div>
    <h1 class="cs-header__title">Pagination</h1>
    <p class="cs-header__desc">한 화면에 다 보여줄 수 없는 목록(테이블, 검색 결과 등)을 여러 페이지로 나눠 이동할 때 사용합니다.</p>
  </div>

  <!-- ============ 기본 ============ -->
  <section class="cs-section">
    <h2 class="cs-section__title">기본</h2>
    <div class="cs-block">
      <nav class="pagination" aria-label="페이지 이동">
        <button class="pagination__btn" aria-label="이전 페이지"><i data-lucide="chevron-left"></i></button>
        <button class="pagination__btn is-active">1</button>
        <button class="pagination__btn">2</button>
        <button class="pagination__btn">3</button>
        <button class="pagination__btn" aria-label="다음 페이지"><i data-lucide="chevron-right"></i></button>
      </nav>
      <code class="cs-code">.pagination__btn.is-active</code>
    </div>
  </section>

  <!-- ============ 생략(...) 있는 경우 ============ -->
  <section class="cs-section">
    <h2 class="cs-section__title">페이지가 많을 때 (생략 표시)</h2>
    <div class="cs-block">
      <nav class="pagination" aria-label="페이지 이동">
        <button class="pagination__btn" aria-label="이전 페이지"><i data-lucide="chevron-left"></i></button>
        <button class="pagination__btn">1</button>
        <span class="pagination__ellipsis">…</span>
        <button class="pagination__btn">6</button>
        <button class="pagination__btn is-active">7</button>
        <button class="pagination__btn">8</button>
        <span class="pagination__ellipsis">…</span>
        <button class="pagination__btn">24</button>
        <button class="pagination__btn" aria-label="다음 페이지"><i data-lucide="chevron-right"></i></button>
      </nav>
      <code class="cs-code">.pagination__ellipsis</code>
    </div>
  </section>

  <!-- ============ 첫/끝 페이지 (버튼 비활성) ============ -->
  <section class="cs-section">
    <h2 class="cs-section__title">첫 페이지 — 이전 버튼 비활성</h2>
    <div class="cs-block">
      <nav class="pagination" aria-label="페이지 이동">
        <button class="pagination__btn" aria-label="이전 페이지" disabled><i data-lucide="chevron-left"></i></button>
        <button class="pagination__btn is-active">1</button>
        <button class="pagination__btn">2</button>
        <button class="pagination__btn">3</button>
        <button class="pagination__btn" aria-label="다음 페이지"><i data-lucide="chevron-right"></i></button>
      </nav>
      <code class="cs-code">.pagination__btn[disabled]</code>
    </div>
  </section>

  <div class="cs-footer">CSS 원본: assets/css/components.css · 토큰: assets/css/tokens.css</div>
</div>

</main>

<script src="/TongssApp/assets/js/vendor/lucide.js"></script>
<script src="/TongssApp/design-system/assets/js/include.js"></script>
<script src="/TongssApp/assets/js/shared/icons.js"></script>
<script src="/TongssApp/design-system/assets/js/nav.js"></script>
<script>
  document.addEventListener('components:ready', () => {
    lucide.createIcons(); // 본문 아이콘 (nav.js가 사이드바 아이콘은 이미 처리함)
  });
</script>
</body>
</html>
